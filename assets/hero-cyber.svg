<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 450" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600;700&amp;display=swap');
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;display=swap');
      
      .window { fill: #0a0a0a; stroke: #333; stroke-width: 1px; rx: 12px; }
      .glow-window { fill: #0a0f14; stroke: #00ffcc; stroke-width: 1px; rx: 12px; filter: drop-shadow(0 0 10px rgba(0,255,204,0.2)); }
      .text-code { font-family: 'Fira Code', monospace; fill: #00FFCC; font-size: 13px; }
      .text-title { font-family: 'Inter', sans-serif; fill: #a1a1aa; font-size: 11px; font-weight: 600; }
      .text-hero { font-family: 'Inter', sans-serif; fill: #ffffff; font-size: 32px; font-weight: 700; }
      .text-hero-highlight { fill: #00FFCC; }
      .text-sub { font-family: 'Fira Code', monospace; fill: #60a5fa; font-size: 14px; }
      .text-label { font-family: 'Inter', sans-serif; fill: #a1a1aa; font-size: 13px; }
      .text-value { font-family: 'Inter', sans-serif; fill: #f4f4f5; font-size: 13px; font-weight: 600; }
      .pill { fill: #111827; stroke: #374151; stroke-width: 1px; rx: 6px; }
      .pill-text { font-family: 'Inter', sans-serif; fill: #9ca3af; font-size: 11px; }
      .ascii { font-family: 'Fira Code', monospace; fill: #00FFCC; font-size: 10px; font-weight: 600; }
